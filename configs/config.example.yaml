# 壁纸社区 v2 后端配置模板（复制为 configs/config.local.yaml 后按需修改）
# JWT 签名密钥严禁写入配置文件，仅从环境变量 WF_AUTH_JWT_SECRET 读取（长度至少 32 字节）。
# 七牛 AK/SK 严禁写入配置文件，仅当 storage.provider=qiniu 时从环境变量
# WF_STORAGE_QINIU_ACCESS_KEY / WF_STORAGE_QINIU_SECRET_KEY 读取。
# RabbitMQ 密码支持环境变量 WF_RABBITMQ_PASSWORD 优先覆盖（生产环境严禁落盘至 YAML）。

server:
  port: 8080
  env: dev

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  dbname: wallpaper_feed
  max_open_conns: 50

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

rabbitmq:
  enabled: false
  host: 127.0.0.1
  port: 5672
  user: guest
  password: ""
  vhost: /

storage:
  # 支持 noop / local / qiniu（可通过环境变量 WF_STORAGE_PROVIDER 覆盖）
  provider: noop
  cdn_domain: ""
  local:
    dir: uploads
    public_url: /api/v1/uploads/files
    upload_url: /api/v1/uploads/local
  qiniu:
    bucket: ""
    zone: z0
    upload_url: ""
