# 壁纸社区 v2 后端配置模板
# 复制为 configs/config.local.yaml 后按需修改；所有配置项均可由 WF_<SECTION>_<KEY> 环境变量覆盖。
# 注意：auth.jwt_secret 严禁写入配置文件，仅从环境变量 WF_AUTH_JWT_SECRET 读取（长度至少 32 字节）。

app:
  name: "wallpaper-feed"
  env: "dev"                 # dev | prod
  log_level: "info"          # debug | info | warn | error

server:
  addr: ":8080"
  read_timeout: "10s"
  write_timeout: "15s"
  idle_timeout: "60s"
  shutdown_timeout: "10s"
  cors_allow_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

mysql:
  dsn: "root:password@tcp(127.0.0.1:3306)/wallpaper_feed?charset=utf8mb4&parseTime=True&loc=UTC"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: "30m"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  dial_timeout: "3s"
  read_timeout: "2s"
  write_timeout: "2s"

auth:
  issuer: "wallpaper-feed"
  access_ttl: "7200s"        # 2 小时
  refresh_ttl: "604800s"     # 7 天
  bcrypt_cost: 10

cache:
  l1_cleanup_interval: "1m"
  user_profile_l1_ttl: "30s"
  user_profile_l2_ttl: "1800s"
  user_profile_null_ttl: "60s"
  jitter_ratio: 0.1

storage:
  cdn_domain: ""             # 例如 https://wp.kirep.top；留空时头像 URL 返回 ""

user:
  default_avatar_key: "avatars/default.png"
