# 复制为 configs/config.local.yaml 后修改；敏感项用环境变量注入（WF_ 前缀，例如 WF_STORAGE_SECRET_KEY）
app:
  env: dev # dev | prod

http:
  addr: ":8080"
  shutdown_timeout_seconds: 10

mysql:
  dsn: "root:password@tcp(127.0.0.1:3306)/wallpaper_feed?charset=utf8mb4&parseTime=true&loc=Local"
  max_open_conns: 20
  max_idle_conns: 10

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

cache:
  local_size_mb: 64
  local_detail_ttl: 30
  local_first_page_ttl: 2
  redis_hot_ttl: 3600
  redis_cold_ttl: 600
  redis_null_ttl: 60

feed:
  latest_hot_size: 1000
  page_default: 20
  page_max: 50

auth:
  # jwt_secret 仅通过环境变量 WF_AUTH_JWT_SECRET 注入（至少 32 字节），Worker 进程无需配置
  issuer: "wallpaper-feed"
  access_token_ttl: 900       # 秒（15 分钟）
  refresh_token_ttl: 604800   # 秒（7 天固定会话）
  bcrypt_cost: 10

user:
  default_avatar_key: "avatars/default.png"
  profile_local_ttl: 30       # 秒
  profile_redis_ttl: 1800     # 秒（±10% 抖动）

follow:
  max_following: 2000         # 单用户最大关注数上限
  stats_local_ttl: 15         # 计数 L1 缓存 TTL（秒）
  stats_redis_ttl: 600        # 计数 L2 缓存 TTL（秒，±10% 抖动）

storage:
  provider: qiniu
  bucket: "wallpaper-community"
  access_key: ""   # WF_STORAGE_ACCESS_KEY
  secret_key: ""   # WF_STORAGE_SECRET_KEY
  cdn_domain: "https://wp.kirep.top"
  upload_url: "https://up-z0.qiniup.com"
  token_expire_seconds: 3600
  max_file_size_mb: 20

rabbitmq:
  url: ""                         # 必填（生产环境通过环境变量 WF_RABBITMQ_URL 注入，日志脱敏不输出凭据）
  exchange: "wallpaper.events"
  dlx_exchange: "wallpaper.dlx"
  fanout_queue: "feed.following.fanout"
  retry_queue: "feed.following.fanout.retry"
  dlq_queue: "feed.following.fanout.dlq"
  retry_delay_ms: 5000            # 消费失败延迟重试间隔（毫秒）
  max_consume_retries: 5          # 消费最大重试次数，超过进 DLQ

following_feed:
  bigv_threshold: 5000            # 大 V 晋升粉丝数阈值（只升不自动降）
  inbox_hot_size: 500             # 普通作者收件箱热窗口条数（不含哨兵）
  outbox_hot_size: 200            # 大 V 发件箱热窗口条数（不含哨兵）
  inbox_ttl_seconds: 604800       # 收件箱 TTL（7 天，写入时 ±10% 抖动）
  outbox_ttl_seconds: 604800      # 发件箱 TTL（7 天，写入时 ±10% 抖动）
  following_ids_local_ttl: 15     # 关注对象 ID 列表 L1 TTL（秒）
  following_ids_redis_ttl: 600    # 关注对象 ID 列表 L2 TTL（秒，±10% 抖动）
  bigv_local_ttl: 30              # 全站大 V 快照 L1 TTL（秒）
  max_sync_outbox_rebuilds: 20    # 单次请求允许同步冷建的大 V 上限，超出则本次整体降级 MySQL
  author_in_chunk_size: 200       # MySQL 分块 IN 查询批次大小

outbox:
  poll_interval_ms: 2000          # API OutboxRelay 兜底轮询间隔（毫秒）
  batch_size: 50                  # 单批 Claim 事件数量
  lease_seconds: 30               # 多实例防重复捞取租约（秒）
  publish_timeout_ms: 5000        # 单条消息 Publisher Confirm 超时（毫秒）
  max_retries: 10                 # 投递最大重试次数，超过标为 status=2 告警
  retention_days: 7               # 已投递记录保留天数（Worker 定时清理）

worker:
  reconcile_interval_seconds: 60        # 最新流 + 全站大 V 集合对账周期（秒）
  outbox_cleanup_interval_seconds: 3600 # Outbox 已发送记录清理周期（秒）
  fanout_prefetch: 8                    # RabbitMQ Channel QoS prefetch
  fanout_concurrency: 4                 # 扇出消费并发协程数（受控有界）
  fanout_batch_size: 500                # 单次扫描粉丝 ID 及 Pipeline 推送批次大小
